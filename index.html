<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Campus Idea Tournament · ODCE TU Hamburg</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />
<style>
  /* ODCE · TU Hamburg look: TUHH turquoise (#00C1D4) + deep navy, angular shapes */
  :root {
    --tuerkis:#00C1D4; --tuerkis-hover:#00ABBD; --tuerkis-ink:#00707C; --tuerkis-soft:#E6F9FB;
    --navy:#0E1A33; --violet:#7200FE; --violet-soft:#F4ECFF; --blue:#143BFF; --mint:#5AFFC5;
    --bg:#F4F6F8; --card:#fff; --text:#0E1A33; --muted:#566275; --border:#DCE2E8;
    --danger:#C81E1E; --radius:4px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; line-height:1.55; }
  .topband { height:6px; background:var(--tuerkis); }
  .masthead { background:#fff; border-bottom:1px solid var(--border); }
  .masthead .in { max-width:760px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:14px; }
  .mark { display:flex; flex-direction:column; line-height:1.15; }
  .mark .u { font-weight:700; font-size:15px; letter-spacing:-.01em; }
  .mark .i { font-size:12px; color:var(--muted); }
  .mark-sq { width:34px; height:34px; background:var(--tuerkis); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11px; color:var(--navy); letter-spacing:.02em; flex-shrink:0; }
  .container { max-width:760px; margin:0 auto; padding:28px 20px 80px; }
  .brand { margin-bottom:22px; }
  .brand .eyebrow { font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--tuerkis-ink); }
  .brand h1 { font-family:'Source Serif 4',Georgia,serif; font-size:32px; font-weight:700; letter-spacing:-.4px; line-height:1.15; }

  /* Phase tracker as a tournament bracket */
  .track { display:grid; grid-template-columns:repeat(4,1fr); gap:0; margin:0 0 24px; list-style:none; border:1px solid var(--border); background:#fff; }
  .track li { position:relative; padding:10px 12px; border-right:1px solid var(--border); }
  .track li:last-child { border-right:none; }
  .track .num { font-size:11px; font-weight:700; color:var(--muted); letter-spacing:.08em; }
  .track .lbl { font-size:14px; font-weight:600; color:var(--muted); }
  .track li.active { background:var(--tuerkis); }
  .track li.active .num, .track li.active .lbl { color:var(--navy); }
  .track li.done { background:var(--tuerkis-soft); }
  .track li.done .num, .track li.done .lbl { color:var(--tuerkis-ink); }
  .track li.done .num::after { content:" ✓"; }

  .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:28px; margin-bottom:16px; }
  .card h2 { font-family:'Source Serif 4',Georgia,serif; font-size:23px; font-weight:700; margin-bottom:8px; letter-spacing:-.2px; line-height:1.25; }
  .card h3 { font-size:17px; font-weight:700; margin-bottom:4px; }
  .phase-tag { display:inline-block; font-size:12px; font-weight:700; color:var(--navy); background:var(--tuerkis-soft); border-left:3px solid var(--tuerkis); padding:3px 8px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:10px; }
  .sub { color:var(--muted); font-size:14.5px; margin-bottom:18px; }
  .sub strong { color:var(--text); }
  .prompt { font-size:16px; margin-bottom:18px; }

  .phase-list { list-style:none; display:grid; gap:8px; margin:6px 0 20px; counter-reset:ph; }
  .phase-list li { display:flex; gap:12px; align-items:flex-start; font-size:14.5px; }
  .phase-list li::before { counter-increment:ph; content:counter(ph); min-width:24px; height:24px; background:var(--navy); color:#fff; font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center; margin-top:1px; }

  .notices { display:grid; gap:10px; }
  .notice { display:flex; gap:12px; border-radius:var(--radius); padding:14px 16px; font-size:14px; border-left:4px solid; }
  .notice .ic { font-size:18px; line-height:1.3; }
  .notice strong { display:block; }
  .notice.ai { background:var(--violet-soft); border-color:var(--violet); color:#3D0087; }
  .notice.anon { background:var(--tuerkis-soft); border-color:var(--tuerkis); color:var(--navy); }

  textarea { width:100%; padding:12px 14px; border:1px solid #C5CED8; border-radius:var(--radius); font:inherit; font-size:15px; outline:none; resize:vertical; min-height:84px; background:#fff; color:var(--text); }
  textarea:focus { border-color:var(--tuerkis-ink); box-shadow:0 0 0 3px rgba(0,193,212,.25); }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 22px; border:none; border-radius:var(--radius); font:inherit; font-size:15px; font-weight:700; cursor:pointer; transition:background .15s; }
  .btn:focus-visible, .icon-btn:focus-visible, input:focus-visible, .btn-link:focus-visible { outline:3px solid var(--blue); outline-offset:2px; }
  .btn-primary { background:var(--tuerkis); color:var(--navy); }
  .btn-primary:hover:not(:disabled) { background:var(--tuerkis-hover); }
  .btn-primary:disabled { background:#D5DCE3; color:#7A8596; cursor:not-allowed; }
  .btn-dark { background:var(--navy); color:#fff; }
  .btn-dark:hover:not(:disabled) { background:#1E2E52; }
  .btn-dark:disabled { background:#D5DCE3; color:#7A8596; cursor:not-allowed; }
  .btn-sm { padding:8px 14px; font-size:14px; }
  .btn-link { background:none; border:none; color:var(--muted); text-decoration:underline; font:inherit; font-size:14px; cursor:pointer; }
  .btn .spin { width:14px; height:14px; border:2px solid rgba(14,26,51,.3); border-top-color:var(--navy); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .actions { display:flex; gap:12px; justify-content:flex-end; align-items:center; margin-top:8px; flex-wrap:wrap; }
  .actions .hint { margin-right:auto; font-size:14px; color:var(--muted); }
  .error { display:none; background:#FDF0F0; border-left:4px solid var(--danger); color:#8B1414; padding:10px 14px; font-size:14px; margin-top:12px; }
  .error.show { display:block; }

  .idea-list { list-style:none; display:grid; gap:8px; margin-bottom:14px; }
  .idea-item { display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border:1px solid var(--border); border-left:3px solid var(--tuerkis); border-radius:var(--radius); background:#FAFCFD; }
  .idea-no { min-width:26px; height:26px; background:var(--navy); color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .idea-text { flex:1; font-size:15px; white-space:pre-wrap; word-break:break-word; }
  .icon-btn { width:34px; height:34px; border:none; background:transparent; border-radius:var(--radius); color:var(--muted); cursor:pointer; font-size:14px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
  .icon-btn:hover:not(:disabled) { background:var(--tuerkis-soft); color:var(--navy); }
  .icon-btn:disabled { opacity:.25; cursor:default; }
  .input-row { display:flex; justify-content:space-between; align-items:center; margin-top:10px; gap:12px; }
  .counter { font-size:14px; color:var(--muted); font-weight:500; }

  /* Ranking */
  .rank-list { list-style:none; display:grid; gap:8px; }
  .rank-item { display:flex; align-items:center; gap:12px; padding:12px 10px 12px 12px; border:1px solid var(--border); border-radius:var(--radius); background:#fff; cursor:grab; user-select:none; }
  .rank-item.dragging { opacity:.5; border-color:var(--tuerkis-ink); }
  .rank-item.drag-over { border-color:var(--tuerkis); background:var(--tuerkis-soft); }
  .rank-badge { min-width:38px; height:38px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0; background:#EEF1F4; color:var(--muted); }
  .rank-badge.r1 { background:var(--tuerkis); color:var(--navy); }
  .rank-badge.r2 { background:#9FE7EF; color:var(--navy); }
  .rank-badge.r3 { background:var(--tuerkis-soft); color:var(--navy); }
  .rank-text { flex:1; font-size:15px; word-break:break-word; }
  .rank-move { display:flex; flex-direction:column; gap:2px; }

  /* Look-only */
  .view-list { list-style:none; display:grid; gap:10px; }
  .view-item { padding:14px 16px; border:1px solid var(--border); border-left:3px solid var(--tuerkis); border-radius:var(--radius); background:#FAFCFD; font-size:15px; white-space:pre-wrap; word-break:break-word; }

  /* Sliders */
  .rate-item { padding:16px; border:1px solid var(--border); border-radius:var(--radius); margin-bottom:10px; background:#fff; }
  .rate-item.done { border-left:3px solid var(--tuerkis); }
  .rate-text { font-size:15px; margin-bottom:12px; white-space:pre-wrap; word-break:break-word; }
  .rate-row { display:flex; align-items:center; gap:14px; }
  .rate-row input[type=range] { flex:1; accent-color:var(--tuerkis-ink); height:28px; cursor:pointer; }
  .rate-row input.untouched { opacity:.35; }
  .rate-val { min-width:92px; text-align:right; font-size:14px; font-weight:700; color:var(--tuerkis-ink); }
  .rate-val.empty-val { color:var(--muted); font-weight:500; }
  .ticks { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin:2px 106px 0 0; padding:0 4px; }

  /* Selection */
  .select-item { display:flex; gap:14px; align-items:flex-start; padding:14px 16px; border:1px solid var(--border); border-radius:var(--radius); margin-bottom:8px; cursor:pointer; background:#fff; }
  .select-item:hover { border-color:#AEB9C5; }
  .select-item.on { border-color:var(--tuerkis); background:var(--tuerkis-soft); box-shadow:inset 3px 0 0 var(--tuerkis); }
  .select-item input { width:20px; height:20px; accent-color:var(--tuerkis-ink); margin-top:2px; flex-shrink:0; cursor:pointer; }
  .select-item span { font-size:15px; word-break:break-word; white-space:pre-wrap; }
  .confirm { display:flex; gap:12px; align-items:flex-start; padding:14px 16px; border-radius:var(--radius); background:var(--violet-soft); border-left:4px solid var(--violet); font-size:14.5px; color:#3D0087; cursor:pointer; margin-top:16px; }
  .confirm input { width:20px; height:20px; accent-color:var(--violet); flex-shrink:0; margin-top:2px; }
  .small-anon { font-size:13px; color:var(--muted); margin-top:12px; display:flex; gap:8px; }

  /* Waiting */
  .waiting { text-align:center; padding:36px 16px; }
  .waiting .pulse { width:56px; height:56px; margin:6px auto 18px; background:var(--tuerkis-soft); position:relative; }
  .waiting .pulse::after { content:""; position:absolute; inset:16px; background:var(--tuerkis); animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform:scale(.55) rotate(45deg); opacity:.6; } }
  .waiting p { color:var(--muted); font-size:14.5px; }

  .done-card { text-align:center; padding:48px 24px; border-top:6px solid var(--tuerkis); }
  .done-card .big { font-size:52px; margin-bottom:10px; }
  .done-card h2 { font-size:28px; }
  .done-card p { color:var(--muted); }
  .meta { font-size:12px; color:var(--muted); margin-top:16px; }

  .footer { max-width:760px; margin:0 auto; padding:0 20px 40px; font-size:12px; color:var(--muted); }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:12px 22px; border-radius:var(--radius); font-size:14px; z-index:200; opacity:0; transition:opacity .3s; pointer-events:none; }
  .toast.show { opacity:1; }
  .demo-flag { position:fixed; top:10px; right:10px; background:var(--mint); color:var(--navy); font-size:11px; font-weight:700; padding:4px 8px; z-index:300; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  @media (max-width:600px) {
    .container { padding:20px 12px 60px; }
    .card { padding:20px 16px; }
    .brand h1 { font-size:26px; }
    .track li { padding:8px 6px; }
    .track .lbl { font-size:12px; }
    .track .num { font-size:10px; }
    .rate-val { min-width:70px; }
    .ticks { margin-right:84px; }
    .mark .i { display:none; }
  }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="topband" aria-hidden="true"></div>
<div class="masthead"><div class="in">
  <div class="mark-sq" aria-hidden="true">ODCE</div>
  <div class="mark"><span class="u">TU Hamburg · ODCE</span><span class="i">Institute for Organizational Design and Collaboration Engineering</span></div>
</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="container">
  <header class="brand">
    <div class="eyebrow">Campus Idea Tournament</div>
    <h1>Make our campus better — with your ideas</h1>
  </header>
  <ol class="track" id="track" aria-label="Tournament phases"></ol>
  <main id="app"></main>
</div>
<footer class="footer">Anonymous study by the Institute for Organizational Design and Collaboration Engineering (ODCE), TU Hamburg.</footer>

<script>
/* ================= CONFIG ================= */
const SB_URL = 'https://uyynxszpmtwfxmnwirjn.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5eW54c3pwbXR3ZnhtbndpcmpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NjE3NDcsImV4cCI6MjA5MTIzNzc0N30.WJexHxaof97Z_hNI9Dv6L4Cq7hlM366dGhu89McUNgE';

// Which ideas do peers evaluate in phase 4?
//  'submitted' = only ideas others submitted (as described to participants)
//  'all'       = all ideas of others, submitted or not (needed to measure selection quality)
const PEER_POOL = 'all';
const PEER_COUNT = 5;            // ideas each participant ranks in phase 4
const MIN_PEER = 2;              // minimum to proceed after waiting
const MIN_IDEAS = 2;             // minimum ideas in phase 1
const WAIT_FALLBACK_MS = 60000;  // after this, accept fewer than PEER_COUNT
const SKIP_AFTER_MS = 180000;    // after this, allow finishing without evaluation
const POLL_MS = 4000;

/* URL options:
   ?host           -> admin dashboard
   ?demo           -> local test mode, nothing is saved
   ?demo&c=1|2|3   -> test a specific screening condition */
const params = new URLSearchParams(location.search);
if (params.has('host')) location.replace('admin.html');
const DEMO = params.has('demo');
const FORCED_C = [1,2,3].includes(+params.get('c')) ? +params.get('c') : null;

const PHASES = ['Creation','Screening','Selection','Evaluation'];
const CRITERION = 'Which idea would improve the campus the most?';

/* ================= STATE ================= */
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() :
  'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); }));

const S = {
  pid: uuid(), session: uuid(), condition: null, phase: 0, phaseStart: Date.now(),
  ideas: [], created: 0, draftPaste: { count:0, chars:0 },
  screenOrder: [], rankOrder: [], scores: {}, interactions: 0,
  selectOrder: [], selected: new Set(), noAi: false,
  peerIdeas: [], peerOrder: [], finished: false
};

/* ================= BACKEND ================= */
async function rpc(fn, args) {
  if (DEMO) return null;
  let lastErr;
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const res = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
        method: 'POST',
        headers: { 'Content-Type':'application/json', apikey:SB_KEY, Authorization:`Bearer ${SB_KEY}` },
        body: JSON.stringify(args)
      });
      const text = await res.text();
      let data = null; try { data = text ? JSON.parse(text) : null; } catch (_) {}
      if (!res.ok) { console.error(`[rpc] ${fn}`, res.status, text); throw new Error((data && data.message) || `HTTP ${res.status}`); }
      return data;
    } catch (e) { lastErr = e; await new Promise(r => setTimeout(r, 700 * (attempt + 1))); }
  }
  throw lastErr;
}

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ideaText = id => (S.ideas.find(i => i.id === id) || S.peerIdeas.find(i => i.id === id) || {}).text || '';
const elapsed = () => Date.now() - S.phaseStart;

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }
function setBusy(btn, on, label) {
  if (!btn) return;
  if (on) { btn.dataset.label = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="spin"></span> ${label || 'Saving…'}`; }
  else { btn.disabled = false; if (btn.dataset.label) btn.innerHTML = btn.dataset.label; }
}
function showError(msg) { const e = $('#err'); if (e) { e.textContent = msg; e.classList.add('show'); } }
function clearError() { const e = $('#err'); if (e) e.classList.remove('show'); }
const SAVE_FAIL = "We couldn't save your answers. Please check your internet connection and press the button again.";

function setPhase(n) {
  S.phase = n; S.phaseStart = Date.now();
  $('#track').innerHTML = PHASES.map((p, i) =>
    `<li class="${i + 1 < n ? 'done' : i + 1 === n ? 'active' : ''}" ${i + 1 === n ? 'aria-current="step"' : ''}>
       <div class="num">PHASE ${i + 1}</div><div class="lbl">${p}</div></li>`).join('');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.addEventListener('beforeunload', e => { if (S.phase >= 1 && !S.finished && (S.ideas.length || S.phase > 1)) { e.preventDefault(); e.returnValue = ''; } });

/* ================= RANK LIST (drag on desktop, buttons everywhere) ================= */
function rankList(el, order, onChange) {
  let dragId = null;
  const render = () => {
    el.innerHTML = order.map((id, i) => `
      <li class="rank-item" draggable="true" data-id="${id}">
        <span class="rank-badge ${i < 3 ? 'r' + (i + 1) : ''}" aria-hidden="true">#${i + 1}</span>
        <span class="rank-text"><span class="sr-only">Rank ${i + 1}: </span>${esc(ideaText(id))}</span>
        <span class="rank-move">
          <button type="button" class="icon-btn" data-move="-1" ${i === 0 ? 'disabled' : ''} aria-label="Move up">▲</button>
          <button type="button" class="icon-btn" data-move="1" ${i === order.length - 1 ? 'disabled' : ''} aria-label="Move down">▼</button>
        </span>
      </li>`).join('');
  };
  const changed = () => { render(); onChange && onChange(); };
  el.onclick = e => {
    const b = e.target.closest('[data-move]'); if (!b) return;
    const id = b.closest('.rank-item').dataset.id, dir = +b.dataset.move;
    const i = order.indexOf(id), j = i + dir;
    if (j < 0 || j >= order.length) return;
    [order[i], order[j]] = [order[j], order[i]];
    changed();
    const again = el.querySelector(`[data-id="${id}"] [data-move="${dir}"]`);
    (again && !again.disabled ? again : el.querySelector(`[data-id="${id}"] [data-move="${-dir}"]`))?.focus();
  };
  el.ondragstart = e => { const it = e.target.closest('.rank-item'); if (!it) return; dragId = it.dataset.id; it.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (_) {} };
  el.ondragover = e => { if (!dragId) return; e.preventDefault(); el.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over')); const it = e.target.closest('.rank-item'); if (it && it.dataset.id !== dragId) it.classList.add('drag-over'); };
  el.ondrop = e => {
    e.preventDefault(); const it = e.target.closest('.rank-item');
    if (it && dragId && it.dataset.id !== dragId) { const f = order.indexOf(dragId), t = order.indexOf(it.dataset.id); order.splice(f, 1); order.splice(t, 0, dragId); changed(); }
    dragId = null;
  };
  el.ondragend = () => { dragId = null; el.querySelectorAll('.dragging,.drag-over').forEach(x => x.classList.remove('dragging', 'drag-over')); };
  render();
}

/* ================= PHASE 1: CREATION ================= */
function renderCreation() {
  setPhase(1);
  app.innerHTML = `
    <section class="card">
      <h2>How would you improve our campus?</h2>
      <p class="prompt">Think about your everyday life at the university — studying and lectures, the library and places to work, food and coffee, spaces to relax or meet others, getting around campus, digital services, events, sustainability, or how students and staff work together. What would make the campus a better place to study, work and spend time? Small fixes and big ideas are both welcome.</p>
      <p class="sub" style="margin-bottom:8px"><strong>This is an idea tournament with four phases:</strong></p>
      <ol class="phase-list">
        <li><span><strong>Idea creation</strong> — come up with as many ideas as you can.</span></li>
        <li><span><strong>Idea screening</strong> — take a closer look at your own ideas.</span></li>
        <li><span><strong>Idea selection</strong> — decide which of your ideas you submit to the tournament.</span></li>
        <li><span><strong>Idea evaluation</strong> — rank ideas from other participants.</span></li>
      </ol>
      <div class="notices">
        <div class="notice anon" role="note">
          <span class="ic" aria-hidden="true">🔒</span>
          <span><strong>Completely anonymous.</strong>We do not ask for your name, e-mail, student ID or any other personal details. Your ideas are stored without any link to you and are shown to other participants anonymously. Nobody — including the lecturers — can see who wrote which idea.</span>
        </div>
        <div class="notice ai" role="note">
          <span class="ic" aria-hidden="true">✋</span>
          <span><strong>No AI, please.</strong>This tournament is about your own ideas. Do not use ChatGPT, Copilot or any other AI tool, and do not copy ideas from the internet or from others.</span>
        </div>
      </div>
    </section>

    <section class="card">
      <span class="phase-tag">Phase 1 · Idea creation</span>
      <h3>Add your ideas</h3>
      <p class="sub">Add as many ideas as you like — one idea per entry. Write each one so that someone else can understand it.</p>
      <ol class="idea-list" id="ideaList"></ol>
      <label for="newIdea" class="sr-only">New idea</label>
      <textarea id="newIdea" rows="3" maxlength="1000" placeholder="Type an idea… (Enter to add, Shift+Enter for a new line)"></textarea>
      <div class="input-row">
        <span class="counter" id="counter" aria-live="polite"></span>
        <button class="btn btn-primary btn-sm" id="addBtn" type="button">+ Add idea</button>
      </div>
    </section>

    <div class="actions">
      <span class="hint" id="lockHint"></span>
      <button class="btn btn-dark" id="nextBtn" type="button" disabled>Lock ideas &amp; continue →</button>
    </div>
    <div class="error" id="err" role="alert"></div>`;

  const ta = $('#newIdea');
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addIdea(); } });
  ta.addEventListener('paste', e => { const t = (e.clipboardData || window.clipboardData)?.getData('text') || ''; S.draftPaste.count++; S.draftPaste.chars += t.length; });
  $('#addBtn').onclick = addIdea;
  $('#nextBtn').onclick = lockIdeas;
  $('#ideaList').onclick = e => { const b = e.target.closest('[data-del]'); if (b) { S.ideas = S.ideas.filter(i => i.id !== b.dataset.del); renderIdeaList(); } };
  renderIdeaList();
  ta.focus();
}

function addIdea() {
  const ta = $('#newIdea'), text = ta.value.trim();
  if (!text) { toast('Type an idea first'); ta.focus(); return; }
  if (S.ideas.some(i => i.text.toLowerCase() === text.toLowerCase())) { toast('You already added this idea'); return; }
  S.ideas.push({ id: uuid(), text, position: ++S.created, created_at: new Date().toISOString(),
                 paste_count: S.draftPaste.count, pasted_chars: S.draftPaste.chars });
  S.draftPaste = { count: 0, chars: 0 };
  ta.value = ''; renderIdeaList(); ta.focus();
}

function renderIdeaList() {
  const n = S.ideas.length;
  $('#ideaList').innerHTML = S.ideas.map((idea, i) => `
    <li class="idea-item">
      <span class="idea-no" aria-hidden="true">${i + 1}</span>
      <span class="idea-text">${esc(idea.text)}</span>
      <button class="icon-btn" type="button" data-del="${idea.id}" aria-label="Remove idea ${i + 1}">✕</button>
    </li>`).join('');
  $('#counter').textContent = n === 1 ? '1 idea' : `${n} ideas`;
  $('#nextBtn').disabled = n < MIN_IDEAS;
  $('#lockHint').textContent = n < MIN_IDEAS ? `Add at least ${MIN_IDEAS} ideas to continue.` : "You can't change your ideas after this step.";
}

async function lockIdeas() {
  const btn = $('#nextBtn');
  if (S.ideas.length < MIN_IDEAS) return;
  if ($('#newIdea').value.trim()) { toast('You still have text in the box — add it or clear it first'); $('#newIdea').focus(); return; }
  clearError(); setBusy(btn, true);
  try {
    if (DEMO) S.condition = FORCED_C || 1 + Math.floor(Math.random() * 3);
    else {
      S.condition = await rpc('register_participant', { p_id: S.pid, p_session: S.session, p_user_agent: null });
      await rpc('save_ideas', { p_participant: S.pid, p_ideas: S.ideas, p_generation_ms: elapsed() });
    }
    renderScreening();
  } catch (e) { setBusy(btn, false); showError(SAVE_FAIL); }
}

/* ================= PHASE 2: SCREENING (3 conditions) ================= */
function renderScreening() {
  setPhase(2);
  S.screenOrder = shuffle(S.ideas.map(i => i.id));
  const c = S.condition;
  const intro = {
    1: { h: 'Look through your ideas', p: 'Take a moment to read through all of your ideas.' },
    2: { h: 'Rank your ideas', p: `Put your ideas in order from <strong>best (#1)</strong> to <strong>worst</strong>. ${CRITERION} Use the arrows or drag and drop.` },
    3: { h: 'Rate your ideas', p: `Rate each idea from <strong>1 (weak)</strong> to <strong>5 (excellent)</strong>. ${CRITERION}` }
  }[c];

  let body = '';
  if (c === 1) body = `<ul class="view-list">${S.screenOrder.map(id => `<li class="view-item">${esc(ideaText(id))}</li>`).join('')}</ul>`;
  if (c === 2) body = `<ol class="rank-list" id="rankList"></ol>`;
  if (c === 3) body = S.screenOrder.map((id, i) => `
      <div class="rate-item" data-id="${id}">
        <p class="rate-text" id="rt-${i}">${esc(ideaText(id))}</p>
        <div class="rate-row">
          <input type="range" min="1" max="5" step="1" value="3" class="untouched" data-id="${id}" aria-labelledby="rt-${i}" aria-valuetext="Not rated yet">
          <span class="rate-val empty-val" id="rv-${id}">Not rated</span>
        </div>
        <div class="ticks" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>
      </div>`).join('');

  app.innerHTML = `
    <section class="card">
      <span class="phase-tag">Phase 2 · Idea screening</span>
      <h2>${intro.h}</h2>
      <p class="sub">${intro.p}</p>
      ${body}
    </section>
    <div class="actions">
      <span class="hint" id="hint"></span>
      <button class="btn btn-primary" id="nextBtn" type="button">Continue to selection →</button>
    </div>
    <div class="error" id="err" role="alert"></div>`;

  if (c === 2) { S.rankOrder = [...S.screenOrder]; rankList($('#rankList'), S.rankOrder, () => S.interactions++); }
  if (c === 3) {
    const labels = { 1: '1 · weak', 2: '2', 3: '3', 4: '4', 5: '5 · excellent' };
    const mark = inp => {
      const id = inp.dataset.id, v = +inp.value;
      if (S.scores[id] !== v) S.interactions++;
      S.scores[id] = v;
      inp.classList.remove('untouched'); inp.setAttribute('aria-valuetext', labels[v]);
      const out = $(`#rv-${id}`); out.textContent = labels[v]; out.classList.remove('empty-val');
      inp.closest('.rate-item').classList.add('done');
      updateRateState();
    };
    app.querySelectorAll('input[type=range]').forEach(inp => { inp.addEventListener('input', () => mark(inp)); inp.addEventListener('change', () => mark(inp)); inp.addEventListener('click', () => mark(inp)); });
    updateRateState();
  }
  $('#nextBtn').onclick = saveScreening;
}

function updateRateState() {
  const done = Object.keys(S.scores).length, n = S.ideas.length;
  $('#nextBtn').disabled = done < n;
  $('#hint').textContent = done < n ? `${done} of ${n} ideas rated` : 'All ideas rated';
}

async function saveScreening() {
  const btn = $('#nextBtn'); clearError(); setBusy(btn, true);
  const items = S.screenOrder.map((id, i) => ({
    id, screen_order: i + 1,
    self_rank: S.condition === 2 ? S.rankOrder.indexOf(id) + 1 : null,
    self_score: S.condition === 3 ? S.scores[id] : null
  }));
  try {
    await rpc('save_screening', { p_participant: S.pid, p_items: items, p_ms: elapsed(), p_interactions: S.interactions });
    renderSelection();
  } catch (e) { setBusy(btn, false); showError(SAVE_FAIL); }
}

/* ================= PHASE 3: SELECTION (identical for all conditions) ================= */
function renderSelection() {
  setPhase(3);
  S.selectOrder = shuffle(S.ideas.map(i => i.id));
  const poolNote = PEER_POOL === 'submitted' ? ' Only submitted ideas will be evaluated by other participants.' : '';
  app.innerHTML = `
    <section class="card">
      <span class="phase-tag">Phase 3 · Idea selection</span>
      <h2>Submit your best ideas</h2>
      <p class="sub">Choose which of your ideas you want to submit to the tournament. Submit as many or as few as you like, but at least one.${poolNote}</p>
      <div id="selList">${S.selectOrder.map(id => `
        <label class="select-item"><input type="checkbox" value="${id}"><span>${esc(ideaText(id))}</span></label>`).join('')}
      </div>
      <label class="confirm"><input type="checkbox" id="noAi"><span><strong>I confirm that these ideas are my own</strong> and that I did not use AI tools or copy them from elsewhere.</span></label>
      <p class="small-anon"><span aria-hidden="true">🔒</span><span>Your submission is anonymous and cannot be traced back to you.</span></p>
    </section>
    <div class="actions">
      <span class="hint" id="hint"></span>
      <button class="btn btn-primary" id="nextBtn" type="button" disabled>Submit to tournament →</button>
    </div>
    <div class="error" id="err" role="alert"></div>`;

  const update = () => {
    const n = S.selected.size;
    $('#hint').textContent = `${n} of ${S.ideas.length} ideas selected`;
    $('#nextBtn').disabled = n < 1 || !S.noAi;
  };
  app.querySelectorAll('#selList input').forEach(cb => cb.addEventListener('change', () => {
    cb.checked ? S.selected.add(cb.value) : S.selected.delete(cb.value);
    cb.closest('.select-item').classList.toggle('on', cb.checked); update();
  }));
  $('#noAi').addEventListener('change', e => { S.noAi = e.target.checked; update(); });
  $('#nextBtn').onclick = saveSelection;
  update();
}

async function saveSelection() {
  const btn = $('#nextBtn'); clearError(); setBusy(btn, true, 'Submitting…');
  try {
    await rpc('save_selection', { p_participant: S.pid, p_ids: [...S.selected], p_no_ai: S.noAi, p_ms: elapsed() });
    startEvaluation();
  } catch (e) { setBusy(btn, false); showError(SAVE_FAIL); }
}

/* ================= PHASE 4: EVALUATION ================= */
const DEMO_PEERS = [
  'Open the library 24/7 during exam weeks, with a quiet zone and a group zone.',
  'Put live occupancy displays for study rooms and the canteen on a campus app.',
  'Install more power outlets and charging lockers in lecture halls and the library.',
  'Create a covered outdoor learning area with Wi-Fi, tables and plants.',
  'Offer a cheap "rescue meal" in the canteen at closing time to cut food waste.',
  'Run a monthly open lab night where students from different programmes build things together.'
];

function startEvaluation() {
  setPhase(4);
  const t0 = Date.now();
  app.innerHTML = `
    <section class="card waiting" aria-live="polite">
      <span class="phase-tag">Phase 4 · Idea evaluation</span>
      <div class="pulse" aria-hidden="true"></div>
      <h2>Collecting ideas from other participants…</h2>
      <p id="waitMsg">This usually takes less than a minute. Please keep this page open.</p>
      <p id="skipWrap" style="margin-top:16px;display:none"><button class="btn-link" id="skipBtn" type="button">Finish without evaluating</button></p>
    </section>
    <div class="error" id="err" role="alert"></div>`;
  $('#skipBtn').onclick = () => finish(true);

  if (DEMO) {
    setTimeout(() => { S.peerIdeas = shuffle(DEMO_PEERS).slice(0, PEER_COUNT).map(text => ({ id: uuid(), text })); renderEvaluation(); }, 1200);
    return;
  }
  const tick = async () => {
    if (S.phase !== 4 || S.peerIdeas.length || S.finished) return;
    const waited = Date.now() - t0;
    try {
      const n = await rpc('count_review_pool', { p_reviewer: S.pid, p_pool: PEER_POOL });
      if (n >= PEER_COUNT || (waited > WAIT_FALLBACK_MS && n >= MIN_PEER)) {
        const rows = await rpc('get_ideas_for_review', { p_reviewer: S.pid, p_n: PEER_COUNT, p_pool: PEER_POOL });
        if (rows && rows.length >= MIN_PEER) {
          S.peerIdeas = rows.map(r => ({ id: r.idea_id, text: r.idea_text }));
          renderEvaluation(); return;
        }
      }
    } catch (e) { console.warn('poll failed', e); }
    if (waited > SKIP_AFTER_MS) { $('#skipWrap').style.display = 'block'; $('#waitMsg').textContent = 'Not enough ideas have been submitted yet. You can keep waiting, or finish now.'; }
    setTimeout(tick, POLL_MS);
  };
  tick();
}

function renderEvaluation() {
  S.phaseStart = Date.now();
  S.peerOrder = shuffle(S.peerIdeas.map(i => i.id));
  const src = PEER_POOL === 'submitted' ? 'These ideas were submitted by other participants.' : 'These ideas come from other participants and are shown anonymously.';
  app.innerHTML = `
    <section class="card">
      <span class="phase-tag">Phase 4 · Idea evaluation</span>
      <h2>Rank these ideas 🔍</h2>
      <p class="sub">${src} Put them in order from <strong>best (#1)</strong> to <strong>worst</strong>. ${CRITERION} Use the arrows or drag and drop.</p>
      <ol class="rank-list" id="peerList"></ol>
    </section>
    <div class="actions"><button class="btn btn-primary" id="nextBtn" type="button">Submit ranking →</button></div>
    <div class="error" id="err" role="alert"></div>`;
  rankList($('#peerList'), S.peerOrder);
  $('#nextBtn').onclick = () => finish(false);
}

async function finish(skipped) {
  const btn = $('#nextBtn'); clearError(); setBusy(btn, true);
  const n = S.peerOrder.length;
  const items = skipped ? [] : S.peerOrder.map((id, i) => ({ idea_id: id, peer_rank: i + 1, set_size: n }));
  try {
    await rpc('save_reviews', { p_reviewer: S.pid, p_items: items, p_ms: elapsed(), p_skipped: !!skipped });
    S.finished = true; renderDone();
  } catch (e) { setBusy(btn, false); showError(SAVE_FAIL); }
}

function renderDone() {
  S.phase = 5;
  $('#track').innerHTML = PHASES.map((p, i) => `<li class="done"><div class="num">PHASE ${i + 1}</div><div class="lbl">${p}</div></li>`).join('');
  app.innerHTML = `
    <section class="card done-card">
      <div class="big" aria-hidden="true">🏆</div>
      <h2>Thank you!</h2>
      <p>Your ideas and rankings are in the tournament. Everything was recorded anonymously. You can close this page now.</p>
      <p class="meta">${DEMO ? 'Demo mode · nothing was saved' : 'Anonymous participation · ODCE, TU Hamburg'}</p>
    </section>`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ================= INIT ================= */
if (DEMO) { const f = document.createElement('div'); f.className = 'demo-flag'; f.textContent = `DEMO${FORCED_C ? ' · condition ' + FORCED_C : ''} · not saved`; document.body.appendChild(f); }
if (!params.has('host')) renderCreation();
</script>
</body>
</html>
